plugins {
    id 'dev.architectury.loom' version "${architectury_loom_version}"
    id 'com.diffplug.spotless' version "${spotless_version}"
}

version = mod_version

base {
    archivesName = "sammui-wynnventory-looter-scooter-$minecraft_version"
}

repositories {
    maven { url = "https://api.modrinth.com/maven" }
}

loom {
    silentMojangMappingsLicense()
}

dependencies {
    minecraft "net.minecraft:minecraft:$minecraft_version"
    mappings loom.officialMojangMappings()

    modImplementation("net.fabricmc:fabric-loader:$fabric_loader_version")
    modImplementation("maven.modrinth:wynntils:v${wynntils_version}-fabric")
    modImplementation(fabricApi.module("fabric-command-api-v2", fabric_api_version))
    modImplementation(fabricApi.module("fabric-key-binding-api-v1", fabric_api_version))
    // The released jar holds WynnVentory's API key, so the mod uses its price fetches instead of its own.
    modImplementation("maven.modrinth:wynnventory:$wynnventory_modrinth_id")

    compileOnly("net.neoforged:bus:$neoforge_eventbus_version")
    compileOnly("com.fasterxml.jackson.core:jackson-databind:$jackson_version")

    testImplementation platform('org.junit:junit-bom:5.10.1')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

test {
    useJUnitPlatform()
}

processResources {
    var replaceProperties = [
        version              : version,
        minecraft_version    : minecraft_version,
        fabric_loader_version: fabric_loader_version,
        wynntils_version     : wynntils_version,
        wynnventory_version  : wynnventory_version
    ]
    inputs.properties replaceProperties

    filesMatching("fabric.mod.json") {
        expand replaceProperties
    }
}

spotless {
    java {
        importOrder()
        removeUnusedImports()
        palantirJavaFormat(spotless_palantir_version)
        trimTrailingWhitespace()
        endWithNewline()
    }
}
